upstreams:
  - repo: decaf-dev/obsidian-note-splitter
    parent: true

verify: pnpm ci && pnpm build && pnpm lint
extra_allowed_tools: Bash(pnpm:*)

guidance: |
  This is an intentional fork of decaf-dev/obsidian-note-splitter. Incorporate
  upstream bug fixes and compatible features while preserving the fork's
  behavior and the changes documented in README.md under "Fork changes".
  Understand both sides of conflicts and adapt upstream changes to this
  repository's structure. If an upstream change conflicts with the fork's
  purpose, preserve the fork's behavior and explain the omitted or adapted
  change in the PR for maintainer review.

  Preserve saving split notes beside the source note when saveFolderPath is
  empty. Keep deleteOriginalNote disabled by default and delete the original
  only after every split note has been created successfully. Trim sections
  before filtering empty content and report the number of notes actually
  created. Retain frontmatter exclusion, literal delimiter splitting with
  escaped newline support, timestamp or content-based filenames, and filename
  collision handling.

  Preserve the existing settings keys and defaults: saveFolderPath, delimiter,
  useContentAsTitle, and deleteOriginalNote. Keep all four settings exclusively
  declarative through getSettingDefinitions() with control bindings and
  automatic persistence. Retain text controls for the output folder and
  delimiter, including empty strings, and toggles for the two boolean options.
  Do not restore imperative display() rendering or lower the Obsidian 1.15.0
  minimum. Preserve the split-by-delimiter command ID and its behavior.

  Port implementation changes into src/main.ts, src/settings/settings.ts, and
  src/utilities.ts. Keep pnpm, @kitschpatrol/shared-config, the TypeScript build
  scripts, the demo vault, and the existing build and lint configuration.
  Regenerate the pnpm lockfile with pnpm when dependency changes require it;
  do not restore upstream's package manager lock files or obsolete build scripts.

  Preserve the obsidian-note-splitter package name, note-splitter plugin ID,
  fork repository metadata, versioning, attribution, and original copyright
  notice. Generate root and dist manifests from package.json rather than
  editing them by hand. Keep GitHub release distribution, including the plugin
  files and installation ZIP; do not restore community registry submission
  tooling or npm publication. Preserve the fork-specific README and let mdat
  regenerate its placeholder sections. Run the configured verification command
  and report any failures or uncertainty.
