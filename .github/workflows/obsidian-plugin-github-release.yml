name: Create Obsidian Plugin GitHub Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Check release version
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("dist/manifest.json", "utf8"));
            if (version !== process.env.GITHUB_REF_NAME) {
              throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match manifest version ${version}`);
            }
          '

      - name: Zip plugin
        run: |
          mkdir -p zip/note-splitter
          cp dist/* zip/note-splitter/
          cd zip
          zip -r "${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}.zip" note-splitter
          rm -r note-splitter

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            zip/*

      - name: Release Notes
        id: release-notes
        uses: kitschpatrol/github-action-release-changelog@e28d84e79b74ee3d1745010c69aafc0f07864ce5 # v3.0.0

      - name: Release
        uses: kitschpatrol/github-action-release@13b1829f4e449586eb63ed614e0429a684cb291c # v3.0.3
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.release-notes.outputs.changelog }}
          files: |
            dist/*
            zip/*
